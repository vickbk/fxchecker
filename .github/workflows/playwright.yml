name: Playwright Tests
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FRANKFURTER_URL: "https://api.frankfurter.dev/v2/"
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  AUTH_GOOGLE_ID: "PLACEHOLDER"
  AUTH_GOOGLE_SECRET: "PLACEHOLDER"
  AI_PROVIDER_KEY: "PLACEHOLDER"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GOOGLE_GENERATIVE_AI_API_KEY: "PLACEHOLDER"

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm package
        uses: pnpm/setup@v1
        with:
          version: 11
          cache: true
          runtime: node@24
          cache-dependency-path: "pnpm-lock.yaml"
          package-json-file: "package.json"

      # Cache Playwright browser binaries to save 2-3 minutes per run
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright OS Dependencies (when cache hits)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Add Playwright Summary to Job
        if: ${{ !cancelled() }}
        run: |
          echo "## 🎭 Playwright E2E Test Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report artifact below to inspect traces and video recordings for failed tests." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
